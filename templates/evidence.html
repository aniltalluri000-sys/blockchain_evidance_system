<!DOCTYPE html>
<html>

<head>

    <title>Evidence Records</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="mb-4">Evidence Records</h2>

<table class="table table-bordered table-striped">

<thead class="table-dark">

<tr>

<th>Case ID</th>

<th>Investigator</th>

<th>Description</th>

<th>Filename</th>

<th>SHA-256 Hash</th>

<th>Upload Time</th>

</tr>

</thead>

<tbody>

{% for row in records %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

<td>{{ row[3] }}</td>

<td>{{ row[4] }}</td>

<td>{{ row[5] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

<a href="/" class="btn btn-primary">Home</a>

</div>

</body>

</html>
