<!DOCTYPE html>
<html>

<head>

    <title>Blockchain Records</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-dark text-white">

<h2>⛓ Blockchain Records</h2>

</div>

<div class="card-body">

<table class="table table-bordered table-hover table-striped">

<thead class="table-dark">

<tr>

<th>Block</th>

<th>Timestamp</th>

<th>Filename</th>

<th>File Hash</th>

<th>Previous Hash</th>

<th>Current Hash</th>

</tr>

</thead>

<tbody>

{% for block in blockchain %}

<tr>

<td>{{ block.index }}</td>

<td>{{ block.timestamp }}</td>

<td>{{ block.filename }}</td>

<td style="font-size:12px;">{{ block.file_hash }}</td>

<td style="font-size:12px;">{{ block.previous_hash }}</td>

<td style="font-size:12px;">{{ block.current_hash }}</td>

</tr>

{% endfor %}

</tbody>

</table>

<a href="/" class="btn btn-primary">

🏠 Home

</a>

</div>

</div>

</div>

</body>

</html>
