<!DOCTYPE html>
<html>

<head>

<title>Search Evidence</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-dark text-white">

<h2>🔍 Search Evidence by Case ID</h2>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Enter Case ID</label>

<input class="form-control" name="case_id" required>

</div>

<button class="btn btn-success">

Search

</button>

</form>

<hr>

{% if records %}

<table class="table table-bordered table-striped">

<tr>

<th>Case ID</th>

<th>Investigator</th>

<th>Description</th>

<th>Filename</th>

<th>Upload Time</th>

</tr>

{% for row in records %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

<td>{{ row[3] }}</td>

<td>{{ row[5] }}</td>

</tr>

{% endfor %}

</table>

{% endif %}

<a href="/" class="btn btn-primary">

🏠 Home

</a>

</div>

</div>

</div>

</body>

</html>
