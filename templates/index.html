<!DOCTYPE html>
<html>

<head>

    <title>Blockchain Evidence System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-dark text-white">

<h2>Blockchain-Based Digital Evidence Integrity System</h2>

</div>

<div class="card-body">

<div class="row text-center mb-4">

<div class="col-md-6">

<div class="card bg-primary text-white">

<div class="card-body">

<h5>Total Evidence</h5>

<h2>{{ total }}</h2>

</div>

</div>

</div>

<div class="col-md-6">

<div class="card bg-success text-white">

<div class="card-body">

<h5>Blockchain Blocks</h5>

<h2>{{ blocks }}</h2>

</div>

</div>

</div>

</div>

<form method="POST" enctype="multipart/form-data">

<div class="mb-3">

<label>Case ID</label>

<input class="form-control" type="text" name="case_id" required>

</div>

<div class="mb-3">

<label>Investigator Name</label>

<input class="form-control" type="text" name="investigator" required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea class="form-control" name="description" rows="3" required></textarea>

</div>

<div class="mb-3">

<label>Select Evidence File</label>

<input class="form-control" type="file" name="evidence" required>

</div>

<button class="btn btn-success">

Upload Evidence

</button>

<hr>

<a href="/verify" class="btn btn-primary">

Verify Evidence

</a>

<a href="/blockchain" class="btn btn-secondary">

View Blockchain

</a>

<a href="/evidence" class="btn btn-info text-white">

Evidence Records

</a>

<a href="/search" class="btn btn-warning">

Search Evidence

</a>

<a href="/download" class="btn btn-danger">

Download Blockchain

</a>

</form>

</div>

</div>

</div>

</body>

</html>
